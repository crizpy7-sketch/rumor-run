<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rumor Run</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23171418'/%3E%3Crect x='3' y='6' width='10' height='6' fill='%23ffd24a'/%3E%3Crect x='2' y='11' width='3' height='3' fill='%23efe4c4'/%3E%3Crect x='11' y='11' width='3' height='3' fill='%23efe4c4'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%;
    background: #141317;
    overflow: hidden;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  #stage {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background:
      radial-gradient(120% 90% at 50% 0%, #26242c 0%, #141317 70%);
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    box-shadow: 0 0 0 2px #26242c, 0 18px 60px rgba(0,0,0,.75);
  }
  #boot {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    color: #ffd24a; font-size: 13px; letter-spacing: .18em;
    text-transform: uppercase;
  }
  #boot.gone { display: none; }
  #boot .err {
    max-width: 60ch; color: #ff6a3d; text-transform: none;
    letter-spacing: 0; white-space: pre-wrap; line-height: 1.5;
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="screen" width="288" height="216"></canvas></div>
  <div id="boot">loading the route&hellip;</div>
  <script type="module">
    const boot = document.getElementById('boot');
    window.addEventListener('error', (e) => {
      boot.classList.remove('gone');
      boot.innerHTML = '<div class="err">' + (e.error && e.error.stack || e.message) + '</div>';
    });
    import('./src/main.js')
      .then((m) => { m.start(document.getElementById('screen')); boot.classList.add('gone'); })
      .catch((err) => {
        boot.innerHTML = '<div class="err">' + (err && err.stack || err) + '</div>';
      });
  </script>
</body>
</html>
